screenshots:
  - path: .camp/screenshots/overview.png
    caption: Course page with nested sections. "Other Uses" and "Glossaries" are displayed as links to their own pages.
  - path: .camp/screenshots/subsection-page.png
    caption: A subsection shown on a separate page, with a "Back to" link to its parent section.
  - path: .camp/screenshots/edit-mode.png
    caption: In edit mode the section menu offers "Add subsection" and "Display as a link".
